<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Machine Check</title>
<!-- SheetJS: local copy first (xlsx.full.min.js next to this file), CDN as fallback -->
<script src="xlsx.full.min.js"></script>
<script>if(!window.XLSX){document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');}</script>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--text:#1d2330;--muted:#6b7280;--line:#e2e5ea;--accent:#1f6feb;--accent-tx:#fff;
--ok:#15803d;--okbg:#e7f6ec;--warn:#9a6700;--warnbg:#fff5d6;--bad:#c4202b;--badbg:#fde8e8;--info:#0b5cad;--infobg:#e6f0ff;--sel:#eaf1ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#181c24;--text:#e6e9ef;--muted:#9aa3b2;--line:#2b313d;--accent:#4c8dff;--accent-tx:#0b0f17;
--ok:#56d364;--okbg:#12301b;--warn:#e3b341;--warnbg:#3a2d0b;--bad:#ff7b72;--badbg:#3d1416;--info:#79b8ff;--infobg:#132a46;--sel:#1c2a40;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-tx);border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
.muted{color:var(--muted)} .small{font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}
.t-bad{background:var(--badbg);color:var(--bad)}.t-info{background:var(--infobg);color:var(--info)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
/* top bar */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 8px 0 0}
.tabs{display:flex;gap:4px}
.tabs button{border:none;border-radius:8px}
.tabs button.on{background:var(--sel);color:var(--accent);font-weight:600}
.week{display:flex;gap:4px;align-items:center;margin-left:auto}
.week b{min-width:170px;text-align:center}
.user{display:flex;gap:6px;align-items:center}
.chip{background:var(--sel);border-radius:16px;padding:4px 10px;font-weight:600}
/* check tab */
.check{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px 16px;align-items:start}
@media (max-width:900px){.check{grid-template-columns:1fr}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:64px}
.side .head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.side .head h2{font-size:15px;margin:0}
.side .list{max-height:calc(100vh - 150px);overflow:auto}
.item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--sel)}
.item.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.item .st{font-weight:600;word-break:break-all}
.work{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-tx);align-items:center;justify-content:center;font-size:12px}
.title{font-size:20px;font-weight:700;word-break:break-all}
.banner{border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600;margin-bottom:8px}
.banner.ok{background:var(--okbg);color:var(--ok)} .banner.bad{background:var(--badbg);color:var(--bad)} .banner.warn{background:var(--warnbg);color:var(--warn)}
.diffs{margin:0 0 8px;padding-left:20px}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
@media (max-width:700px){.decide{grid-template-columns:1fr}}
.decide button{padding:10px;text-align:left}
.decide button b{display:block;font-size:15px}
.decide .p{border-color:var(--ok)} .decide .a{border-color:var(--warn)} .decide .f{border-color:var(--bad)}
.file{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details summary{cursor:pointer;color:var(--accent)}
.howto{line-height:1.9}
/* status/activity */
.page{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .big{font-size:28px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:65vh}
/* modal + toasts */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--panel);border-radius:12px;padding:20px;width:440px;max-width:100%;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0}
.modal label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--accent);color:var(--accent-tx);border-color:var(--accent)}
.setup{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.setup div{display:flex;gap:8px;align-items:center;justify-content:space-between}
#log{position:fixed;right:16px;bottom:16px;max-width:440px;display:flex;flex-direction:column;gap:6px;z-index:30}
.msg{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15);white-space:pre-wrap}
.msg.err{border-left-color:var(--bad)}.msg.warn{border-left-color:var(--warn)}.msg.ok{border-left-color:var(--ok)}
[hidden]{display:none!important}
.check.withpdf{grid-template-columns:340px minmax(0,1fr) minmax(340px,42vw)}
@media (max-width:900px){.check.withpdf{grid-template-columns:1fr}}
#pdfPane{position:sticky;top:64px;height:calc(100vh - 80px);min-height:320px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#pdfPane[hidden]{display:none}
#pdfPane .ph{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
#pdfPane .ph b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#pdfPane iframe{flex:1;border:0;width:100%;background:#fff}
.pdfrows td input{width:100%}
.pdfadd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
</style>
<style>
.lang{display:flex;gap:2px}.lang button{padding:3px 8px;font-size:12px}.lang button.on{background:var(--accent);color:var(--accent-tx);border-color:var(--accent)}
.seg3 button{font-size:13px;padding:6px 4px}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:600}
.prevbad td{background:var(--warnbg)}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.vcard.done{opacity:.75}
.vhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.vhead .title{font-size:16px}
.vact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.linebar{padding:6px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
.linebar button{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linepanel{border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.linegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:2px 6px;max-height:240px;overflow:auto}
.linegrid label{display:flex;gap:4px;align-items:center;font-size:13px;cursor:pointer}
.sugg{border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;margin:6px 0}
.sugg .r{display:flex;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line)}
.sugg .r:last-child{border-bottom:none}
.sugg .r .nm{font-weight:600;word-break:break-all}
tr.tot td{font-weight:700;border-top:2px solid var(--text);border-bottom:none;background:var(--sel)}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;margin-top:6px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="overlay" id="login">
  <div class="modal">
    <div class="row"><h2 data-i18n="appTitle"></h2><div class="lang" style="margin-left:auto"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div></div>
    <div class="muted small" data-i18n="appSub"></div>
    <label><span data-i18n="yourName"></span><input id="lgName" data-i18n-ph="namePh" autocomplete="name"></label>
    <div><b data-i18n="iAm"></b><div class="seg seg3" style="margin-top:4px">
      <button data-role="IE" data-i18n="roleIE"></button><button data-role="Tech" data-i18n="roleTech"></button><button data-role="Consolidator" data-i18n="roleCons"></button><button data-role="Supervisor" data-i18n="roleSup"></button></div></div>
    <label><span id="lgPuLbl"></span><select id="lgPU"></select></label>
    <div class="setup">
      <b data-i18n="filesOnce"></b>
      <div><span id="lgDir"></span><button id="lgDirBtn"></button></div>
      <div><span id="lgDb"></span><button id="lgDbBtn"></button></div>
      <div><span id="lgLay"></span><button id="lgLayBtn"></button></div>
      <div class="muted small" data-i18n="layoutFolderOpt"></div>
    </div>
    <button class="primary" id="lgStart" data-i18n="start"></button>
    <div class="muted small" data-i18n="nameNote"></div>
  </div>
</div>

<!-- ============ SETTINGS ============ -->
<div class="overlay" id="settings" hidden>
  <div class="modal">
    <h2 data-i18n="settings"></h2>
    <div class="setup">
      <div><span id="stDir"></span><button id="stDirBtn" data-i18n="change"></button></div>
      <div><span id="stDb"></span><button id="stDbBtn" data-i18n="change"></button></div>
      <div><span id="stLay"></span><button id="stLayBtn" data-i18n="change"></button></div>
    </div>
    <label style="flex-direction:row;align-items:center;font-weight:normal;gap:6px"><input type="checkbox" id="stBase"><span data-i18n="inclBase"></span></label>
    <button class="primary" id="stClose" data-i18n="close"></button>
  </div>
</div>

<!-- ============ TOP BAR ============ -->
<header>
  <h1 data-i18n="appTitle"></h1><span class="tag t-info" id="verTag" title="Version">V4.3.1</span>
  <nav class="tabs">
    <button data-tab="check" data-i18n="tabCheck"></button>
    <button data-tab="variation" data-i18n="tabVar"></button>
    <button data-tab="status" data-i18n="tabStatus"></button>
    <button data-tab="activity" data-i18n="tabAct"></button>
  </nav>
  <div class="week">
    <button id="wkPrev" data-i18n-title="prevWeek">◀</button>
    <b id="wkText"></b>
    <button id="wkNext" data-i18n-title="nextWeek">▶</button>
    <button id="wkToday" data-i18n="thisWeek"></button>
  </div>
  <div class="user">
    <span class="chip" id="userChip"></span>
    <div class="lang"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
    <button id="btnReload" data-i18n="refresh" data-i18n-title="refreshTip"></button>
    <button id="btnPlan" data-i18n="loadPlan" data-i18n-title="loadPlanTip"></button>
    <button id="btnSettings" data-i18n-title="settings">⚙</button>
    <button id="btnLogout" data-i18n="logout"></button>
  </div>
</header>

<!-- ============ TAB: CHECK ============ -->
<section id="tab-check" class="check">
  <aside class="side">
    <div class="head"><h2 id="listTitle"></h2><select id="pu" style="margin-left:auto"></select></div>
    <div class="linebar"><span class="muted small" data-i18n="lineFilter"></span><button id="btnLines"></button></div>
    <div class="linepanel" id="linePanel" hidden>
      <b class="small" data-i18n="pickLines"></b>
      <input id="lineSearch" data-i18n-ph="searchLine">
      <div class="row"><button id="lnAll" data-i18n="selectAll"></button><button id="lnNone" data-i18n="selectNone"></button></div>
      <div class="linegrid" id="lineGrid"></div>
      <button id="lnDone" class="primary" data-i18n="done"></button>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="work" id="work"></div>
  <aside id="pdfPane" hidden><div class="ph"><b id="pdfTitle"></b><a id="pdfNew" target="_blank" rel="noopener"></a><button id="pdfClose">✕</button></div><iframe id="pdfFrame" title="PDF"></iframe></aside>
</section>

<!-- ============ TAB: VARIATION LOG ============ -->
<section id="tab-variation" class="page" hidden>
  <div class="kpis" id="vKpis"></div>
  <div class="row">
    <select id="vSt"><option value="ACTIVE" data-i18n="fActive"></option><option value="OPEN" data-i18n="vOpen"></option><option value="STILL_DIFF" data-i18n="vStill"></option>
      <option value="WAITING_LAYOUT" data-i18n="vWait"></option><option value="CLOSED" data-i18n="vClosed"></option><option value="" data-i18n="fAll"></option></select>
    <select id="vPU"><option value="" data-i18n="allPU"></option></select>
    <input id="vSearch" data-i18n-ph="search" size="18">
    <div class="seg" style="width:220px"><button id="vViewCards" class="on" data-i18n="viewCards"></button><button id="vViewTable" data-i18n="viewTable"></button></div>
    <button id="btnExpVar" style="margin-left:auto" data-i18n="exportLog"></button>
  </div>
  <div id="vBody" style="display:flex;flex-direction:column;gap:10px"></div>
</section>

<!-- ============ TAB: STATUS ============ -->
<section id="tab-status" class="page" hidden>
  <div class="kpis" id="kpis"></div>
  <div class="row">
    <b data-i18n="styles"></b>
    <select id="fPU"><option value="" data-i18n="allPU"></option></select>
    <select id="fSt"><option value="" data-i18n="allResults"></option><option value="PENDING" data-i18n="PENDING"></option><option value="FAIL" data-i18n="FAIL"></option><option value="PASS" data-i18n="PASS"></option><option value="ACCEPTED" data-i18n="ACCEPTED"></option></select>
    <span class="muted" id="stCount"></span>
    <button id="btnExpStatus" style="margin-left:auto" data-i18n="exportXl"></button>
  </div>
  <div class="tablewrap" id="stTable"></div>
</section>

<!-- ============ TAB: ACTIVITY ============ -->
<section id="tab-activity" class="page" hidden>
  <div class="row">
    <b data-i18n="whoWhat"></b>
    <select id="aUser"></select>
    <select id="aAct"></select>
    <span class="muted" id="aCount"></span>
    <button id="btnExpAct" style="margin-left:auto" data-i18n="exportXl"></button>
  </div>
  <div class="tablewrap" id="aTable"></div>
</section>

<div id="log"></div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  planSheet: 'MasterPlan-Full',          // sheet in the weekly plan file
  dbSheet: 'Machine Database',           // sheet in the Machine DB file
  lineMapFile: 'Linemapping.xlsx',       // must sit inside the data folder (Line | PU)

/* ================= DATA ================= */
async function connect() {
  const dir = await idb.get('dataDir'), dbh = await idb.get('dbFile');
  if (!await ensurePerm(dir, 'readwrite', t('start'))) throw new Error(t('needFiles'));
  if (!await ensurePerm(dbh, 'read', t('start'))) throw new Error(t('needFiles'));
  S.dataDir = dir; S.dbHandle = dbh;
  await initLayoutRoot(false);
  let fh; try { fh = await dir.getFileHandle(CONFIG.lineMapFile); } catch { throw new Error(CONFIG.lineMapFile + ' ?'); }
  const lwb = await readWb(await fh.getFile());
  S.lineMap = parseLineMap(sheetRows(lwb.Sheets[lwb.SheetNames[0]]));
  await refreshPuList();
  await reloadData();
}
async function loadDb() {
  const f = await S.dbHandle.getFile();
  S.db = parseDb(sheetRows(await readSheetCI(f, CONFIG.dbSheet))); S.dbName = f.name;
}
async function loadChecks() {
  const all = await readJsonDir(CONFIG.validationDir), appr = await readJsonDir('approvals');
  S.vals = all.filter(v => !isApproval(v));
  S.approvals = {};
  all.filter(isApproval).concat(appr).sort((a, b) => String(a.savedAt).localeCompare(String(b.savedAt))).forEach(a => S.approvals[K(a.style)] = a);
  const raw = await readJsonDir(CONFIG.variationDir);
  S.rawActs = raw;
  S.varActs = []; raw.forEach(a => (a.keys || []).forEach(k => S.varActs.push(Object.assign({}, a, { key: k }))));
}
function computeVars() { S.vars = buildVariations(S.vals, S.db, S.varActs); S.stages = styleStages(S.vals, S.rawActs, S.db); }
async function reloadData() {
  const txt = await readText(S.dataDir, CONFIG.stylePlanFile);
  S.sp = txt ? JSON.parse(txt) : { styles: {}, loads: [] };
  await loadChecks(); await loadDb(); computeVars();
  if (!S.sp.loads.length) toast(t('noPlan'), 'warn');
}
async function loadPlan() {
  if (!isSup()) throw new Error(t('onlySupPlan'));
  const [h] = await window.showOpenFilePicker({ id: 'lcPlan', types: XL_TYPES });
  const f = await h.getFile();
  toast(t('reading', f.name));
  const plan = parsePlan(sheetRows(await readSheetCI(f, CONFIG.planSheet)));
  const txt = await readText(S.dataDir, CONFIG.stylePlanFile);
  const sp = txt ? JSON.parse(txt) : { styles: {}, loads: [] };
  if (txt) await writeText(S.dataDir, 'stylePlan.bak.json', txt);
  const unmapped = Object.keys(plan.linesSeen).filter(l => lookupPU(S.lineMap, l) === 'UNMAPPED').sort();
  const nNew = updateStylePlan(sp, plan, stamp(), { planFile: f.name, unmapped, loadedBy: S.user.name, loadedAt: new Date().toISOString() });
  await writeText(S.dataDir, CONFIG.stylePlanFile, JSON.stringify(sp));
  S.sp = sp;
  const nSt = Object.keys(plan.styles).length;
  act('LOAD_PLAN', '', f.name + ' · ' + fmt(plan.start) + '–' + fmt(plan.end) + ' · ' + nSt + ' / ' + nNew);
  toast(t('planLoaded', fmt(plan.start), fmt(plan.end), nSt, nNew), 'ok');
  if (unmapped.length) toast(t('unmappedMsg', CONFIG.lineMapFile, unmapped.join(', ')), 'warn');
  renderAll();
}

function syncPdf(l) {              // typed rows -> the same machine structure an Excel sheet gives

function parsePasted(text) {
  const rows = []; let ignored = 0;
  String(text || '').split(/\r?\n/).forEach(line => {
    const ln = line.trim(); if (!ln) return;
    if (/^(total|tổng|cộng|stt|no\.?\b|m\/c\b|machine|qty|stt)/i.test(ln)) { ignored++; return; }
    let m = ln.match(/^(.*?[A-Za-z].*?)[\s:=×x\-–]+(\d+(?:[.,]\d+)?)\s*$/);
    if (m) { rows.push({ m: m[1].trim(), q: num(m[2].replace(',', '.')) }); return; }
    m = ln.match(/^(\d+(?:[.,]\d+)?)\s*[×x]?\s+(.*[A-Za-z].*)$/);
    if (m) { rows.push({ m: m[2].trim(), q: num(m[1].replace(',', '.')) }); return; }
    ignored++;
  });

}

      (sg.escalate ? ' <span class="tag t-bad">' + esc(t('tagRounds', sg.rounds)) + '</span>' : '') + '</div>';
    if (la && /^TECH_/.test(la.action) && la.valId === v0.valId) h += '<div class="note">🔧 ' + esc(la.by) + ' · ' + dt(la.at) + ': ' + esc(la.note || '') + '</div>';
    h += '<table style="margin-top:6px"><thead><tr><th>' + t('thMachine') + '</th><th>' + t('thGroup') + '</th><th>' + t('thType') + '</th><th class="n">' + t('thDbCheck') + '</th><th class="n">' + t('thLayout') +
      '</th><th class="n">' + t('thDbNow') + '</th><th class="n">' + t('thToFix') + '</th><th>' + t('thStatus') + '</th></tr></thead><tbody>' +
      g.map(v => '<tr><td><b>' + esc(v.machine) + '</b></td><td>' + esc(v.group) + '</td><td>' + RES_TXT(v.type) + '</td><td class="n">' + v.dbAtCheck + '</td><td class="n">' + v.layout + '</td><td class="n">' + (v.dbNow ?? '') +
        '</td><td class="n"><b>' + (v.status === 'CLOSED' ? 0 : (v.remaining > 0 ? '+' : '') + v.remaining) + '</b></td><td><span class="tag ' + VST_CLS[v.status] + '">' + VST_TXT(v.status) +
        (v.closeReason ? ' · ' + t('cr' + v.closeReason) : '') + '</span>' + (v.closedBy ? ' <span class="muted small">' + esc(v.closedBy) + '</span>' : '') + '</td></tr>').join('') + '</tbody></table>';
    if (active.length && canCons()) h += '<div class="muted small" style="margin-top:6px">' + esc(t('consHint')) + '</div><div class="vact">' +
      '<button data-copy="' + v0.valId + '" title="' + esc(t('copyTip')) + '">' + t('copyList') + '</button>' +
      '<button class="primary" data-verify="' + v0.valId + '">' + t('verify') + '</button>' +
      (waiting ? '<button data-reopen="' + v0.valId + '">' + t('reopen') + '</button>' : '<button data-fixlayout="' + v0.valId + '">' + t('layoutFix') + '</button>') + '</div>';
    return h + '</div>';
  }).join('');
  $('vBody').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => guard(() => copyCorrection(b.dataset.copy)));
  $('vBody').querySelectorAll('[data-verify]').forEach(b => b.onclick = () => guard(() => verifyDb(b.dataset.verify)));
  $('vBody').querySelectorAll('[data-fixlayout]').forEach(b => b.onclick = () => guard(() => sendBack(b.dataset.fixlayout)));
  $('vBody').querySelectorAll('[data-reopen]').forEach(b => b.onclick = () => guard(() => varAction(b.dataset.reopen, 'REOPEN', '')));
}
async function writeVarAction(valId, action, keys, note, extra) {
  const v0 = S.vars.find(v => v.valId === valId) || S.vals.find(v => v.valId === valId);
  const rec = Object.assign({ valId, style: v0.style, keys, action, by: S.user.name, role: S.user.role, at: new Date().toISOString(), note }, extra || {});
  const d = await S.dataDir.getDirectoryHandle(CONFIG.variationDir, { create: true });
  await writeText(d, stamp() + '_' + action + '_' + safe(v0.style) + '_' + safe(S.user.name) + '.json', JSON.stringify(rec, null, 1));
  keys.forEach(k => S.varActs.push(Object.assign({}, rec, { key: k })));
  S.rawActs.push(rec);
  computeVars();
  await act('VAR_' + action, v0.style, note);
}
async function techAction(action) {
  if (!canTech()) throw new Error(t('techOnly'));
  const r = S.sel, g = r.stg || {}, comment = $('comment').value.trim();
  if (!S.cmp) throw new Error(t('techNeedLayout'));
  if (action === 'TECH_DB_WRONG' && comment.length < 3) { $('comment').focus(); throw new Error(t('needComment', t('techDbWrong'))); }
  const valId = g.check.valId, keys = S.vars.filter(v => v.valId === valId && isActiveVar(v)).map(v => v.key);
  const diffCount = S.cmp.groupDiffCount;
  const result = { diffCount, layoutFiles: S.layouts.map(l => l.file).join(' | '), layoutSheets: S.layouts.map(l => l.sel.join(' + ')).join(' | '),
    details: S.cmp.rows.map(x => ({ machine: x.machine, db: x.db, lay: x.lay, result: x.result })) };
  const note = action === 'TECH_DB_WRONG' ? t('techDbWrongNote', comment) : t('techFixedNote', diffCount) + (comment ? ' · ' + comment : '');
  await writeVarAction(valId, action, keys, note, { result });
  if (action === 'TECH_DB_WRONG') toast(t('techSentCons', r.style), 'ok');
  else if (!diffCount) toast(t('techOk', r.style), 'ok'); else toast(t('techLeft', r.style, diffCount), 'warn');
  S.sel = null; S.layouts = []; S.cmp = null; renderAll();
}
async function varAction(valId, action, note) {
  if (!canCons()) throw new Error(t('consOnly'));
  const keys = S.vars.filter(v => v.valId === valId && isActiveVar(v)).map(v => v.key);
  await writeVarAction(valId, action, keys, note);
  renderAll();
}
async function sendBack(valId) {
  if (!canCons()) throw new Error(t('consOnly'));
  const note = window.prompt(t('askLayoutNote'), '');
  if (note === null) return;
  await varAction(valId, 'LAYOUT_TO_FIX', note.trim());
  toast(t('sentBack', S.vars.find(v => v.valId === valId).style), 'ok');
}
async function copyCorrection(valId) {
  if (!canCons()) throw new Error(t('consOnly'));
  const check = S.vals.find(v => v.valId === valId);
  const rows = correctionRows(check, S.db, isoOfSerial(todaySerial()));
  await copyText(rows.map(r => r.join('\t')).join('\n'));
  act('COPY_LIST', check.style, rows.length + ' rows');
  toast(t('copied', rows.length), 'ok');
}
async function verifyDb(valId) {
  if (!canCons()) throw new Error(t('consOnly'));
  const before = S.vars.filter(v => v.valId === valId && isActiveVar(v)).map(v => v.key);
  await loadDb(); computeVars();                                  // read the corrected Machine Database again
  const after = S.vars.filter(v => before.includes(v.key));
  const still = after.filter(isActiveVar);
  const style = after[0].style;
  const note = still.length ? still.map(v => v.machine + ' ' + v.dbNow + '→' + v.layout).join(', ') : 'variation = 0';
  await writeVarAction(valId, 'DB_UPDATED', before, note);
  if (!still.length) toast(t('verifyAllOk', style), 'ok');
  else toast(t('verifySome', style, still.length, still.map(v => '• ' + v.machine + ': ' + t('thDbNow') + ' ' + v.dbNow + ', ' + t('thLayout') + ' ' + v.layout).join('\n')), 'warn');
  renderAll();
}

/* ================= TAB 3: STATUS ================= */
function renderStatus() {
  if (!S.sp) return;
  const data = S.supData = supervisorData(S.sp, S.lineMap, S.vals, S.wkS, S.inclBase);
  const openVar = {}; S.vars.filter(isActiveVar).forEach(v => varPUs(v).forEach(p => openVar[p] = (openVar[p] || 0) + 1));
  $('kpis').innerHTML = data.sum.length ? data.sum.map(s => {
    const done = s.PASS + s.ACCEPTED;
    return '<div class="kpi"><div class="row"><b style="font-size:16px">' + esc(s.pu) + '</b><span class="tag ' + (s.pct >= 100 ? 't-ok' : s.pct >= 50 ? 't-warn' : 't-bad') + '" style="margin-left:auto">' + t('pctDone', s.pct) + '</span></div>' +
      '<div class="big">' + done + ' / ' + s.week + '</div><div class="muted small">' + t('checkedThisWeek') + '</div><div class="bar"><i style="width:' + s.pct + '%"></i></div>' +
      '<div class="small">' + t('kpiLine', s.PASS, s.ACCEPTED, s.FAIL, s.PENDING) + '</div>' +
      (s.carry ? '<div class="small" style="color:var(--bad)">' + t('openEarlier', s.carry) + '</div>' : '') +
      '<div class="small" style="color:var(--' + (openVar[s.pu] ? 'bad' : 'ok') + ')">' + t('openVarsKpi', openVar[s.pu] || 0) + '</div></div>';
  }).join('') : '<div class="muted">' + t('noStyles') + '</div>';
  const fp = $('fPU').value, fs = $('fSt').value;
  const cntSt = { CONS: 0, TECH: 0, RECHECK: 0, ESC: 0 };
  data.rows.forEach(r => { const g = S.stages[r.key]; if (!g) return; if (cntSt[g.stage] !== undefined) cntSt[g.stage]++; if (g.escalate) cntSt.ESC++; });
  $('kpis').insertAdjacentHTML('beforeend', '<div class="kpi"><div class="small">' + t('kWaitCons') + ': <b>' + cntSt.CONS + '</b></div><div class="small">' + t('kWaitTech') + ': <b>' + cntSt.TECH + '</b></div>' +
    '<div class="small">' + t('kRecheck') + ': <b>' + cntSt.RECHECK + '</b></div><div class="small" style="color:var(--' + (cntSt.ESC ? 'bad' : 'ok') + ')">' + t('kRounds') + ': <b>' + cntSt.ESC + '</b></div></div>');
  const rows = data.rows.filter(r => (!fp || r.pu === fp) && (!fs || r.status === fs));
  $('stCount').textContent = t('stylesN', rows.length);
  $('stTable').innerHTML = '<table><thead><tr><th>' + t('thPU') + '</th><th>' + t('thStyle') + '</th><th>' + t('thLoadsFirst') + '</th><th>' + t('thWhen') + '</th><th>' + t('thResult') + '</th><th>' + t('thNow') + '</th><th>' +
    t('thCheckedBy') + '</th><th>' + t('thSavedAt') + '</th><th class="n">' + t('thDiffs') + '</th><th>' + t('thComment') + '</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + esc(r.pu) + '</td><td><b>' + esc(r.style) + '</b></td><td>' + esc(r.firstLines) + ' · ' + fmt(r.firstDate, false) + '</td><td>' +
      (r.scope === 'This week' ? t('thisWeek') : '<span class="tag t-bad">' + t('earlierWeek') + '</span>') + '</td><td><span class="tag ' + STATUS_CLS[r.status] + '">' + t(r.status) + '</span>' + (r.pdf ? ' <span class="tag t-info">PDF</span>' : '') +
      (r.status === 'PENDING' && S.approvals[r.key] ? ' <span class="tag t-info">' + t('tagApproved') + '</span>' : '') + '</td><td>' +
      (S.stages[r.key] ? esc(t(OWN[S.stages[r.key].stage])) + (S.stages[r.key].escalate ? ' <span class="tag t-bad">' + esc(t('tagRounds', S.stages[r.key].rounds)) + '</span>' : '') : esc(t('ownIE'))) + '</td><td>' +
      esc(r.user) + '</td><td>' + esc(r.savedAt) + '</td><td class="n">' + esc(r.diff) + '</td><td class="muted">' + esc(r.comment) + '</td></tr>').join('') + '</tbody></table>';
}

/* ================= TAB 4: ACTIVITY ================= */
async function renderActivity() {
  if (!S.dataDir) return;
  await loadActivity();
  const users = [...new Set(S.acts.map(a => a.name))].sort(), acts = [...new Set(S.acts.map(a => a.action))].sort();
  const keepU = $('aUser').value, keepA = $('aAct').value;
  $('aUser').innerHTML = '<option value="">' + t('everyone') + '</option>' + users.map(u => '<option' + (u === keepU ? ' selected' : '') + '>' + esc(u) + '</option>').join('');
  $('aAct').innerHTML = '<option value="">' + t('allActions') + '</option>' + acts.map(a => '<option value="' + a + '"' + (a === keepA ? ' selected' : '') + '>' + esc(t('a' + a)) + '</option>').join('');
  const rows = S.acts.filter(a => (!keepU || a.name === keepU) && (!keepA || a.action === keepA));
  $('aCount').textContent = t('actionsN', rows.length);
  const cls = a => a === 'SAVE_FAIL' ? 't-bad' : a.startsWith('SAVE') || a === 'VAR_DB_UPDATED' ? 't-ok' : a === 'LOAD_PLAN' ? 't-info' : a.startsWith('VAR') ? 't-warn' : '';
  $('aTable').innerHTML = '<table><thead><tr><th>' + t('thTime') + '</th><th>' + t('thName') + '</th><th>' + t('thRole') + '</th><th>' + t('thAction') + '</th><th>' + t('thStyle') + '</th><th>' + t('thDetail') + '</th></tr></thead><tbody>' +
    rows.map(a => '<tr><td>' + dt(a.time) + '</td><td><b>' + esc(a.name) + '</b></td><td>' + roleTxt(a.role) + (a.pu && a.role === 'IE' ? ' · ' + esc(a.pu) : '') +
      '</td><td><span class="tag ' + cls(a.action) + '">' + esc(t('a' + a.action)) + '</span></td><td>' + esc(a.style) + '</td><td class="muted">' + esc(a.detail) + '</td></tr>').join('') + '</tbody></table>';
}

/* ================= EXPORT ================= */
function exportStatus() {
  if (!S.supData) return;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.supData.sum.map(s => ({ [t('thPU')]: s.pu, [t('checkedThisWeek')]: s.week, [t('PASS')]: s.PASS, [t('ACCEPTED')]: s.ACCEPTED, [t('FAIL')]: s.FAIL, [t('PENDING')]: s.PENDING, '%': s.pct, [t('earlierWeek')]: s.carry }))), 'Summary');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.supData.rows.map(r => ({ [t('thPU')]: r.pu, [t('thStyle')]: r.style, [t('thLoadsFirst')]: r.firstLines, Date: fmt(r.firstDate), [t('thResult')]: t(r.status), [t('thCheckedBy')]: r.user, [t('thSavedAt')]: r.savedAt, [t('thDiffs')]: r.diff, [t('thComment')]: r.comment }))), 'Styles');
  XLSX.writeFile(wb, 'LayoutCheck_Status_W' + isoWeek(S.wkS) + '.xlsx');
  act('EXPORT', '', 'Status W' + isoWeek(S.wkS));
}
function exportVariations() {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.vars.map(v => ({
    [t('thFoundAt')]: dt(v.foundAt), [t('thFoundBy')]: v.foundBy, [t('thPU')]: varPUs(v).join(' / '), [t('thStyle')]: v.style, 'IE': t(v.checkStatus), [t('ieComment')]: v.checkComment,
    [t('thMachine')]: v.machine, [t('thGroup')]: v.group, [t('thType')]: RES_TXT(v.type), [t('thDbCheck')]: v.dbAtCheck, [t('thLayout')]: v.layout, [t('thDbNow')]: v.dbNow ?? '',
    [t('thToFix')]: v.status === 'CLOSED' ? 0 : v.remaining, [t('thStatus')]: VST_TXT(v.status) + (v.closeReason ? ' · ' + t('cr' + v.closeReason) : ''),
    [t('thClosedBy')]: v.closedBy, [t('thClosedAt')]: dt(v.closedAt), [t('thLastAction')]: v.lastAction ? t('aVAR_' + v.lastAction.action) + ' · ' + v.lastAction.by + ' · ' + (v.lastAction.note || '') : ''
  }))), 'Variation log');
  XLSX.writeFile(wb, 'LayoutCheck_VariationLog_' + isoOfSerial(todaySerial()) + '.xlsx');
  act('EXPORT', '', 'Variation log');
}
function exportActivity() {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.acts.map(a => ({ [t('thTime')]: a.time.replace('T', ' ').slice(0, 19), [t('thName')]: a.name, [t('thRole')]: roleTxt(a.role), PU: a.pu, [t('thAction')]: t('a' + a.action), [t('thStyle')]: a.style, [t('thDetail')]: a.detail }))), 'Activity');
  XLSX.writeFile(wb, 'LayoutCheck_Activity_W' + isoWeek(S.wkS) + '.xlsx');
  act('EXPORT', '', 'Activity W' + isoWeek(S.wkS));
}

/* ================= INIT ================= */
(function init() {
  if (!window.XLSX) toast('xlsx.full.min.js ?', 'err');
  if (!window.showDirectoryPicker) toast('Microsoft Edge / Google Chrome', 'err');
  initPdfPane();
  fillPuSelects();
  refreshPuList();
  $('lgName').value = localStorage.getItem('lcName') || '';
  fillPuSelects(localStorage.getItem('lcPU') || CONFIG.pus[0]);
  $('stBase').checked = S.inclBase;
  applyStatic(); setRole(S.role); paintSetup(); setTab('check');
  document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => setRole(b.dataset.role));
  $('lgDirBtn').onclick = () => guard(chooseDir); $('lgDbBtn').onclick = () => guard(chooseDb);
  $('lgLayBtn').onclick = () => guard(chooseLayRoot); $('stLayBtn').onclick = () => guard(chooseLayRoot);
  $('lgStart').onclick = () => guard(startSession);
  $('lgName').onkeydown = e => { if (e.key === 'Enter') guard(startSession); };
  $('btnSettings').onclick = () => { paintSetup(); $('settings').hidden = false; };
  $('stDirBtn').onclick = () => guard(chooseDir); $('stDbBtn').onclick = () => guard(chooseDb);
  $('stBase').onchange = e => { S.inclBase = e.target.checked; localStorage.setItem('lcBase', S.inclBase ? 'Y' : 'N'); renderAll(); };
  $('stClose').onclick = () => $('settings').hidden = true;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $('wkPrev').onclick = () => { S.wkS -= 7; renderAll(); };
  $('wkNext').onclick = () => { S.wkS += 7; renderAll(); };
  $('wkToday').onclick = () => { S.wkS = weekStart(todaySerial()); renderAll(); };
  $('btnReload').onclick = () => guard(async () => { await reloadData(); renderAll(); toast(t('latestLoaded'), 'ok'); });
  $('btnPlan').onclick = () => guard(loadPlan);
  $('btnLogout').onclick = () => guard(logout);
  $('pu').onchange = () => { S.sel = null; loadMyLines(); renderList(); renderWork(); if (!$('linePanel').hidden) renderLineGrid(); };
  $('btnLines').onclick = toggleLinePanel; $('lnDone').onclick = toggleLinePanel;
  $('lineSearch').oninput = renderLineGrid;
  $('lnAll').onclick = () => { const s = new Set(S.myLines || []); $('lineGrid').querySelectorAll('input').forEach(cb => s.add(cb.value)); S.myLines = s.size ? s : null; renderLineGrid(); paintLineBtn(); };
  $('lnNone').onclick = () => { S.myLines = null; renderLineGrid(); paintLineBtn(); };
  $('vSt').onchange = renderVariations; $('vPU').onchange = renderVariations; $('vSearch').oninput = renderVariations;
  $('vViewCards').onclick = () => { S.vView = 'cards'; $('vViewCards').classList.add('on'); $('vViewTable').classList.remove('on'); renderVariations(); };
  $('vViewTable').onclick = () => { S.vView = 'table'; $('vViewTable').classList.add('on'); $('vViewCards').classList.remove('on'); renderVariations(); };
  $('btnExpVar').onclick = () => guard(exportVariations);
  $('fPU').onchange = renderStatus; $('fSt').onchange = renderStatus;
  $('aUser').onchange = () => guard(renderActivity); $('aAct').onchange = () => guard(renderActivity);
  $('btnExpStatus').onclick = () => guard(exportStatus);
  $('btnExpAct').onclick = () => guard(exportActivity);
  window.addEventListener('beforeunload', () => { if (S.user) act('LOGOUT', '', 'closed page'); });
})();
</script>
</body>
